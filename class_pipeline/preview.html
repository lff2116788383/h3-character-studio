<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>class_pipeline 精灵播放器</title>
<style>
  body{margin:0;background:#17181c;color:#cfd3dc;font:14px/1.5 "Segoe UI",system-ui;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px}
  h1{font-size:16px;margin:0;color:#9fb4d0}
  #stage{position:relative;image-rendering:pixelated;background:
    linear-gradient(#1e2026 0 100%);border:1px solid #333a46}
  #base,#onion{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
  #strip{display:flex;gap:6px}
  .cell{width:96px;height:96px;image-rendering:pixelated;border:1px solid #333a46;cursor:pointer;opacity:.6}
  .cell.cur{border-color:#e8b64c;opacity:1}
  #bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
  button{background:#2a3140;color:#dfe5ee;border:1px solid #3c4557;padding:4px 12px;cursor:pointer}
  button.on{background:#e8b64c;color:#17181c;border-color:#e8b64c}
  button.dir{min-width:52px}
  button.dir.on{background:#6fa8dc;border-color:#6fa8dc}
  input[type=range]{width:280px}
  #info{color:#8a93a5;font-size:12px}
  #qc{max-width:760px;white-space:pre-wrap;font:11px/1.6 Consolas,monospace;color:#7d8798;background:#1e2026;padding:8px 12px;border-radius:6px}
</style>
</head>
<body>
<h1>class_pipeline 播放验证（Step5）— <span id="cls"></span></h1>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="strip"></div>
<div id="bar">
  <span id="dirs"></span>
  <span id="motions"></span>
  <button id="play">⏸ 暂停</button>
  <input id="scrub" type="range" min="0" max="7" value="0" step="1">
  <span id="info"></span>
  <label>缩放 <select id="zoom"><option>2</option><option>3</option><option>1</option></select></label>
  <label><input id="ghost" type="checkbox"> 洋葱皮</label>
  <label><input id="baseline" type="checkbox" checked> 脚底线</label>
</div>
<div id="qc"></div>
<script>
const qs = new URLSearchParams(location.search);
const cls = qs.get("class") || "swordsman";
document.getElementById("cls").textContent = cls;
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let manifest, dir = "right", motions = [], cur = "walk", idx = 0,
    playing = true, last = 0, acc = 0, sheetImg = {};

// v2 manifest: directions.<d>.motions; 兼容 v1 扁平(motions 顶层)
const getMotions = () => manifest.directions ? manifest.directions[dir].motions : manifest.motions;
const assetUrl = (m) => manifest.directions
  ? `./${cls}/assets/${dir}/${m.sheet}` : `./${cls}/assets/${m.sheet}`;

function draw() {
  const m = getMotions()[cur];
  const cellW = m.cell[0], cellH = m.cell[1];
  const z = +document.getElementById("zoom").value;
  cv.width = cellW * z; cv.height = cellH * z;
  const stage = document.getElementById("stage");
  stage.style.width = cv.width + "px"; stage.style.height = cv.height + "px";
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (document.getElementById("ghost").checked && idx > 0) {
    ctx.globalAlpha = .3;
    ctx.drawImage(sheetImg[cur], idx * cellW - cellW, 0, cellW, cellH, 0, 0, cv.width, cv.height);
    ctx.globalAlpha = 1;
  }
  ctx.drawImage(sheetImg[cur], idx * cellW, 0, cellW, cellH, 0, 0, cv.width, cv.height);
  if (document.getElementById("baseline").checked) {
    ctx.strokeStyle = "rgba(255,80,80,.55)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, cellH * z - .5); ctx.lineTo(cv.width, cellH * z - .5); ctx.stroke();
    ctx.strokeStyle = "rgba(80,160,255,.4)";
    ctx.beginPath(); ctx.moveTo(cv.width / 2 - .5, 0); ctx.lineTo(cv.width / 2 - .5, cv.height); ctx.stroke();
  }
  document.getElementById("info").textContent =
    `${dir}/${cur} f${idx}/${m.frames} fps=${m.fps} loop=${m.loop} cell=${cellW}x${cellH}`;
  document.getElementById("scrub").value = idx;
  document.querySelectorAll(".cell").forEach((c, i) => c.classList.toggle("cur", i === idx));
}

function tick(t) {
  if (playing && last) {
    const m = getMotions()[cur];
    acc += t - last;
    const step = 1000 / m.fps;
    while (acc >= step) {
      acc -= step;
      idx++;
      if (idx >= m.frames) idx = m.loop ? 0 : (playing = false, 0);
    }
    draw();
  }
  last = t;
  requestAnimationFrame(tick);
}

function select(name) {
  cur = name; idx = 0; playing = true;
  document.getElementById("play").textContent = "⏸ 暂停";
  document.querySelectorAll("#motions button").forEach(b => b.classList.toggle("on", b.dataset.m === name));
  const m = getMotions()[cur];
  const s = document.getElementById("scrub"); s.max = m.frames - 1; s.value = 0;
  const strip = document.getElementById("strip"); strip.innerHTML = "";
  for (let i = 0; i < m.frames; i++) {
    const c = document.createElement("canvas");
    c.className = "cell"; c.width = m.cell[0]; c.height = m.cell[1];
    c.getContext("2d").drawImage(sheetImg[name], i * m.cell[0], 0, m.cell[0], m.cell[1], 0, 0, m.cell[0], m.cell[1]);
    c.onclick = () => { idx = i; playing = false; document.getElementById("play").textContent = "▶ 播放"; draw(); };
    strip.appendChild(c);
  }
  draw();
}

function buildDirButtons(dirs) {
  const bar = document.getElementById("dirs");
  if (dirs.length <= 1) return;
  dirs.forEach(d => {
    const b = document.createElement("button");
    b.className = "dir"; b.textContent = d; b.dataset.d = d;
    b.onclick = () => loadDir(d);
    bar.appendChild(b);
  });
}

// 切方向: 重载该方向全部动作 sheet 后重建动作按钮
function loadDir(d) {
  dir = d;
  document.querySelectorAll("#dirs button").forEach(b => b.classList.toggle("on", b.dataset.d === d));
  motions = Object.keys(getMotions());
  sheetImg = {};
  Promise.all(motions.map(n => new Promise(res => {
    const im = new Image();
    im.onload = () => { sheetImg[n] = im; res(); };
    im.src = assetUrl(getMotions()[n]);
  }))).then(() => {
    const bar = document.getElementById("motions"); bar.innerHTML = "";
    motions.forEach(n => {
      const b = document.createElement("button");
      b.textContent = n; b.dataset.m = n;
      b.onclick = () => select(n);
      bar.appendChild(b);
    });
    const want = qs.get("motion");
    select(want && motions.includes(want) ? want : "walk");
    if (qs.get("paused") === "1") { playing = false; document.getElementById("play").textContent = "▶ 播放"; }
    if (qs.get("frame")) { idx = Math.min(+qs.get("frame"), getMotions()[cur].frames - 1); }
    draw();
  });
}

fetch(`./${cls}/assets/manifest.json`).then(r => r.json()).then(mj => {
  manifest = mj;
  const dirs = manifest.directions ? Object.keys(manifest.directions) : ["right"];
  buildDirButtons(dirs);
  const wantDir = qs.get("direction");
  loadDir(wantDir && dirs.includes(wantDir) ? wantDir : dirs[0]);
  fetch(`./${cls}/client_contract/qc_summary.json`).then(r => r.ok ? r.json() : null)
    .then(q => { if (q) document.getElementById("qc").textContent = "契约 QC：\n" + JSON.stringify(q, null, 1); })
    .catch(() => {});
  requestAnimationFrame(tick);
});
document.getElementById("play").onclick = e => {
  playing = !playing; last = 0;
  e.target.textContent = playing ? "⏸ 暂停" : "▶ 播放";
  if (playing && idx >= getMotions()[cur].frames - 1 && !getMotions()[cur].loop) idx = 0;
};
document.getElementById("scrub").oninput = e => { idx = +e.target.value; playing = false; document.getElementById("play").textContent = "▶ 播放"; draw(); };
document.getElementById("zoom").onchange = draw;
document.getElementById("ghost").onchange = draw;
document.getElementById("baseline").onchange = draw;
addEventListener("keydown", e => {
  if (e.key === " ") { e.preventDefault(); document.getElementById("play").click(); }
  if (e.key === "ArrowLeft") { idx = (idx - 1 + getMotions()[cur].frames) % getMotions()[cur].frames; playing = false; draw(); }
  if (e.key === "ArrowRight") { idx = (idx + 1) % getMotions()[cur].frames; playing = false; draw(); }
});
</script>
</body>
</html>
